<!DOCTYPE html>
<html class="light" lang="es">

<head>
    <!-- Meta -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title -->
    <title>Bienvenido KeyServe</title>
    <!-- Tailwind (dev) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <!-- Tailwind config -->
    <script src="js/tailwind-config.js"></script>
    <!-- Global styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body
    class="bg-background-light dark:bg-background-dark transition-colors duration-300 min-h-screen flex flex-col font-display">
    <!-- Top Navigation Bar -->
    <header
        class="w-full flex items-center justify-between px-8 py-4 border-b border-gray-200 dark:border-gray-800 bg-white/50 dark:bg-background-dark/50 sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-primary rounded-lg text-white">
                <span class="material-symbols-outlined block text-2xl">grid_view</span>
            </div>
            <h2 class="text-[#111717] dark:text-white text-xl font-extrabold tracking-tight">KeyServe</h2>

        </div>
        <button id="themeToggle"
            class="flex items-center justify-center p-2 rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">
            <span class="material-symbols-outlined" data-icon="dark_mode">dark_mode</span>
        </button>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-12 relative overflow-hidden">
        <!-- Elementos de fondo abstractos -->
        <div class="absolute top-[-10%] right-[-5%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-[-10%] left-[-5%] w-[40%] h-[40%] bg-primary/10 rounded-full blur-[100px]"></div>
        <div class="w-full max-w-[1000px] flex flex-col md:flex-row items-center gap-12 z-10">
            <!-- Lado izquierdo: marca y contexto -->
            <div class="flex-1 text-center md:text-left">
                <div class="mb-6">
                    <h1
                        class="text-[#111717] dark:text-white text-4xl md:text-6xl lg:text-7xl font-black leading-tight tracking-tight mb-4">
                        Bienvenido a <br />
                        <span class="text-primary">KeyServe</span>
                    </h1>
                    <p class="text-gray-600 dark:text-gray-400 text-lg max-w-md">
                        Autoservicio de Licencias Microsoft diseñado para facilitar la gestión académica de software
                        institucional.
                    </p>
                </div>
            </div>
            <!-- Lado derecho: tarjeta de interacción -->
            <div class="flex-1 w-full max-w-lg">
                <div
                    class="bg-white dark:bg-background-dark/60 p-10 rounded-[2rem] shadow-2xl shadow-primary/5 border border-gray-100 dark:border-gray-800 fluent-glass">
                    <div class="mb-8 overflow-hidden rounded-2xl h-48 w-full bg-gray-100 dark:bg-gray-800">
                        <div class="w-full h-full bg-cover bg-center"
                            data-alt="Abstract blue digital security circuit background"
                            style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD78wg3OwM7bdrwkN2PM6CNyKeWI8OEkoKQmM6vMpkYJr9MLnWyKtIgBqZcm_OBDGhX3rjKwrbsFi0kGMroFNIwfQ8dp0__1XwPWbiiwoGST1Cz94HyLqOOudpD3WuiGr_7xP5Ot7DeCCJT1xG4Lje2Dvyjn_mptE_lLJ9bLsnEJCwFLEEVBheu4_qU79DeduF3bdoXCz6JCOBp5xrQCyLi-qrbt3-euN4lgIPC9gTneChxgYQGcHmNca1tY-jUhpo094Zbbcyyy0w');">
                        </div>
                    </div>
                    <div class="space-y-6">
                        <div>
                            <label class="block text-[#111717] dark:text-white text-2xl font-bold mb-2 ml-1">
                                Identifíquese para continuar
                            </label>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">badge</span>
                                <input
                                    class="w-full pl-12 pr-4 py-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 text-[#111717] dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none text-base placeholder:text-gray-400 dark:placeholder:text-gray-500"
                                    placeholder="Ingrese su nombre completo" type="text" />
                            </div>
                        </div>
                        <button id="btnIngresar"
                            class="w-full bg-primary hover:bg-[#158d99] text-white font-bold py-4 px-6 rounded-xl flex items-center justify-center gap-2 transition-all transform hover:scale-[1.02] active:scale-95 shadow-lg shadow-primary/20">
                            <span>Ingresar al Portal</span>
                            <span class="material-symbols-outlined">arrow_forward</span>
                        </button>
                        <div
                            class="pt-4 flex items-center justify-center gap-2 text-xs text-gray-400 dark:text-gray-500 font-medium">
                            <span class="material-symbols-outlined text-sm">verified_user</span>
                            Portal Seguro - Encriptación SSL Activada
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Meta -->
    <footer class="w-full py-8 text-center border-t border-gray-100 dark:border-gray-800">
        <span class="text-xs mt-1 block opacity-75">© 2025 KeyServe Management System. Todos los derechos
            reservados.</span>
        </p>
    </footer>

    <!-- Page script -->
    <script src="js/index.js"></script>
    <script src="js/theme.js"></script>
</body>

</html>
